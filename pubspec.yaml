name: nest
description: "El nuevo Nest"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  collection: ^1.18.0
  dynamic_color: ^1.7.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  receive_sharing_intent: ^1.8.1
  flutter_colorpicker: ^1.1.0
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  fleather: 1.22.0
  uuid: ^3.0.7
  connectivity_plus: ^6.1.1
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^1.0.0
  path: ^1.9.1
  firebase_core: ^3.11.0
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.0
  firebase_storage: ^12.4.3
  google_sign_in: ^6.2.2
  local_auth: ^2.3.0
  device_info_plus: ^11.2.1
  shared_preferences: ^2.5.2
  url_launcher: ^6.3.1
  permission_handler: ^11.4.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.12.0
  webview_flutter_wkwebview: ^3.16.0
  pointer_interceptor: ^0.10.1+1
  device_calendar: ^4.3.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon.svg
    - assets/icon.png
